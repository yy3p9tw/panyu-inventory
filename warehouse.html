<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>倉管庫存</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=43" />
</head>
<body>
  <header class="site-header">
    <h1>倉管庫存</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="hint-text" id="refreshStatus"></span>
      <button type="button" class="secondary" id="refreshBtn">重新整理</button>
    </div>
  </header>

  <main>
    <div id="appContent">
      <div class="tab-row" id="tabRow">
        <button type="button" class="tab-btn active" data-tab="taishan">泰山</button>
        <button type="button" class="tab-btn" data-tab="taichung">台中</button>
        <button type="button" class="tab-btn" data-tab="expiring">快到期</button>
        <button type="button" class="tab-btn" data-tab="consignment">寄庫</button>
        <button type="button" class="tab-btn" data-tab="lockedStock">鎖庫</button>
        <button type="button" class="tab-btn" data-tab="stocktake">盤點</button>
        <button type="button" class="tab-btn" data-tab="history">歷史</button>
      </div>

      <!-- 泰山 -->
      <section id="tabTaishan" class="tab-panel">
        <div class="panel">
          <input type="text" id="taishanSearchInput" placeholder="搜尋品號或品名..." />
          <p class="hint-text" id="taishanSummary"></p>
          <div class="table-scroll">
            <table class="data-table wh-stock-table">
              <thead>
                <tr><th>品名</th><th>庫存</th><th>最短效期</th></tr>
              </thead>
              <tbody id="taishanTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 台中 -->
      <section id="tabTaichung" class="tab-panel" style="display:none;">
        <div class="panel">
          <input type="text" id="taichungSearchInput" placeholder="搜尋品號或品名..." />
          <p class="hint-text" id="taichungSummary"></p>
          <div class="table-scroll">
            <table class="data-table wh-stock-table">
              <thead>
                <tr><th>品名</th><th>庫存</th><th>最短效期</th></tr>
              </thead>
              <tbody id="taichungTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 快到期 -->
      <section id="tabExpiring" class="tab-panel" style="display:none;">
        <div class="panel">
          <input type="text" id="expiringSearchInput" placeholder="搜尋品號或品名..." />
          <p class="hint-text" id="expiringCount"></p>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>品名</th><th>庫別</th><th>批號(到期日)</th><th>剩餘天數</th><th>包裝數量</th></tr>
              </thead>
              <tbody id="expiringTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 寄庫 -->
      <section id="tabConsignment" class="tab-panel" style="display:none;">
        <div class="panel">
          <input type="text" id="consignmentSearchInput" placeholder="搜尋客戶或品名..." />
          <p class="hint-text" id="consignmentCount"></p>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>客戶</th><th>品名</th><th>寄庫數量</th><th>泰山</th><th>台中</th></tr>
              </thead>
              <tbody id="consignmentTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 鎖庫 -->
      <section id="tabLockedStock" class="tab-panel" style="display:none;">
        <div class="panel">
          <input type="text" id="lockedStockSearchInput" placeholder="搜尋品號或品名..." />
          <p class="hint-text" id="lockedStockCount"></p>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>品名</th><th>倉庫</th><th>標籤</th><th>鎖庫數量</th><th>備註</th></tr>
              </thead>
              <tbody id="lockedStockTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 盤點：只能看/列印空白表單，數字實體寫在紙上，不在這裡輸入 -->
      <section id="tabStocktake" class="tab-panel" style="display:none;">
        <div class="panel">
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;">
            <label style="display:flex; flex-direction:column; font-size:12px; color:#6b7280; gap:2px; flex:1; min-width:240px;">
              選擇盤點
              <select id="stocktakeSessionSelect" style="padding:6px 8px;"></select>
            </label>
            <button type="button" id="stocktakePrintBtn">列印空白表單</button>
            <button type="button" id="stocktakeExcelBtn" class="secondary">產生Excel</button>
          </div>
          <p class="hint-text" id="stocktakeCount"></p>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>品號</th><th>品名</th><th>客戶</th><th>盤點數量</th></tr>
              </thead>
              <tbody id="stocktakeTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 盤點空白表單：只在列印時顯示，平常用style.css的.print-only隱藏起來 -->
      <div id="stocktakePrintSheet" class="print-only">
        <h2 id="stocktakePrintTitle"></h2>
        <table class="data-table">
          <thead>
            <tr><th>品號</th><th>品名</th><th>客戶</th><th>盤點數量</th></tr>
          </thead>
          <tbody id="stocktakePrintTableBody"></tbody>
        </table>
      </div>

      <!-- 歷史 -->
      <section id="tabHistory" class="tab-panel" style="display:none;">
        <div class="panel">
          <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px;">
            <label style="display:flex; flex-direction:column; font-size:12px; color:#6b7280; gap:2px;">
              日期
              <input type="date" id="historyDateInput" style="padding:6px 8px;" />
            </label>
            <label style="display:flex; flex-direction:column; font-size:12px; color:#6b7280; gap:2px;">
              資料種類
              <select id="historyTypeSelect" style="padding:6px 8px;">
                <option value="stock">庫存（泰山/台中）</option>
                <option value="batchList">批號</option>
                <option value="consignment">寄庫</option>
                <option value="lockedStock">鎖庫</option>
              </select>
            </label>
            <button type="button" id="historyLoadBtn">查詢</button>
          </div>
          <p class="hint-text" id="historyCount"></p>
          <div class="table-scroll">
            <table class="data-table">
              <thead id="historyTableHead"></thead>
              <tbody id="historyTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="warehouse.js?v=58"></script>
</body>
</html>
