<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>廠務物料</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=36" />
</head>
<body>
  <header class="site-header">
    <h1>廠務物料</h1>
  </header>

  <main>
    <div id="appContent">
      <div class="tab-row" id="tabRow">
        <button type="button" class="tab-btn active" data-tab="factory">廠務用料</button>
        <button type="button" class="tab-btn" data-tab="availableMaterial">可用原料(泰山)</button>
        <button type="button" class="tab-btn" data-tab="lockedStock">鎖庫</button>
        <button type="button" class="tab-btn" data-tab="history">歷史</button>
      </div>

      <!-- 廠務用料 -->
      <section id="tabFactory" class="tab-panel">
        <div class="panel">
          <input type="text" id="factoryMaterialSearchInput" placeholder="搜尋品名..." />
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>品名</th><th>數量</th><th>最短效期</th></tr>
              </thead>
              <tbody id="factoryMaterialTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 可用原料(泰山) -->
      <section id="tabAvailableMaterial" class="tab-panel" style="display:none;">
        <div class="panel">
          <input type="text" id="availableMaterialSearchInput" placeholder="搜尋品名..." />
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>品名</th><th>數量</th><th>批號</th><th>標記</th></tr>
              </thead>
              <tbody id="availableMaterialTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 鎖庫 -->
      <section id="tabLockedStock" class="tab-panel" style="display:none;">
        <div class="panel">
          <input type="text" id="lockedStockSearchInput" placeholder="搜尋品號或品名..." />
          <p class="hint-text" id="lockedStockCount"></p>
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>品號</th><th>品名</th><th>倉庫</th><th>標籤</th><th>鎖庫數量</th><th>備註</th></tr>
              </thead>
              <tbody id="lockedStockTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 歷史 -->
      <section id="tabHistory" class="tab-panel" style="display:none;">
        <div class="panel">
          <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px;">
            <label style="display:flex; flex-direction:column; font-size:12px; color:#6b7280; gap:2px;">
              日期
              <input type="date" id="historyDateInput" style="padding:6px 8px;" />
            </label>
            <label style="display:flex; flex-direction:column; font-size:12px; color:#6b7280; gap:2px;">
              資料種類
              <select id="historyTypeSelect" style="padding:6px 8px;">
                <option value="factoryMaterial">廠務用料</option>
                <option value="stock">庫存（泰山/台中）</option>
                <option value="batchList">批號</option>
                <option value="lockedStock">鎖庫</option>
              </select>
            </label>
            <button type="button" id="historyLoadBtn">查詢</button>
          </div>
          <p class="hint-text" id="historyCount"></p>
          <div class="table-scroll">
            <table class="data-table">
              <thead id="historyTableHead"></thead>
              <tbody id="historyTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="factory.js?v=36"></script>
</body>
</html>
